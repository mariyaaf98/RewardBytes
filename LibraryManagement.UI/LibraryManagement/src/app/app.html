<!-- app.html -->
<!-- Main layout: Sidebar + Header + Page Content -->

<div class="app-layout">

  <!-- ═══════════════════════════
       SIDEBAR (always visible)
  ══════════════════════════════ -->
  <aside class="sidebar">

    <!-- Logo -->
    <div class="logo-area">
      <div class="logo-icon">📖</div>
      <div class="logo-text">LibraryMS</div>
      <div class="logo-sub">Admin Panel</div>
    </div>

    <!-- Menu Links -->
    <nav class="nav-menu">
      @for (item of navItems; track item.label) {
        <a
          class="nav-item"
          [routerLink]="item.link"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="{ exact: false }">
          <span class="nav-icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">VERSION 1.0.0</div>

  </aside>

  <!-- ═══════════════════════════
       RIGHT SIDE
  ══════════════════════════════ -->
  <div class="main-area">

    <!-- HEADER (always visible) -->
    <header class="topbar">
      <h1 class="topbar-title">Library Management System</h1>
      <div class="admin-info">
        <div class="admin-avatar">A</div>
        <div>
          <div class="admin-name">Admin</div>
          <div class="admin-role">Super Admin</div>
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <!-- ✅ router-outlet loads the current page here -->
    <!-- Do NOT put <app-dashboard> here — router-outlet handles it -->
    <main class="page-content">
      <router-outlet />
    </main>

  </div>

</div>
